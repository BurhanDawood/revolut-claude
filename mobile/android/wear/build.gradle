apply plugin: 'com.android.application'

// Desk #59: the Revolut X watch app (Galaxy Watch 8, Wear OS). The same applicationId and signing key as the phone app,
// so the Wearable Data Layer pairs the two (the key handover) and the watch sees one product. No key or token is in here:
// the phone app hands the dashboard key over at run time (WatchBridge -> KeyListener).
def keystorePath = System.getenv('ANDROID_KEYSTORE_FILE')
def canSign = keystorePath && file(keystorePath).exists()

android {
    namespace = "com.bryan.revolutx.wear"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bryan.revolutx"
        minSdkVersion 30   // Wear OS 3+
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((System.getenv('VERSION_CODE') ?: '1') as Integer)
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"   // CI's emulator job only (FaceRenderTest)
    }
    signingConfigs {
        if (canSign) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // R8: v15 was 13.0 MB (two ~6 MB dex files), too big for a reliable Wi-Fi ADB push to the watch.
            // proguard-rules.pro keeps every class the system binds by name.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSign) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-wearable:$playServicesWearableVersion"
    implementation "androidx.wear.tiles:tiles:1.4.0"
    implementation "androidx.wear.protolayout:protolayout:1.2.0"
    implementation "androidx.wear.watchface:watchface-complications-data-source:1.2.1"
    implementation "androidx.wear:wear-remote-interactions:1.0.0"
    implementation "androidx.concurrent:concurrent-futures:1.2.0"
    implementation "androidx.security:security-crypto:$androidxSecurityCryptoVersion"

    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "junit:junit:$junitVersion"
}
