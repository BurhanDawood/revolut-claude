<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revolut X Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --surface2: #242424;
      --accent: #00ffc8;
      --accent-dim: rgba(0, 255, 200, 0.15);
      --text: #e8e8e8;
      --text-muted: #888;
      --danger: #ff4d6a;
      --warn: #ffaa00;
      --radius: 12px;
      --gap: 16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    #last-updated {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .spinner {
      display: none;
      width: 12px;
      height: 12px;
      border: 2px solid var(--text-muted);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .spinner.active { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-banner {
      display: none;
      background: rgba(255, 77, 106, 0.1);
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--danger);
      margin-bottom: 16px;
    }
    .error-banner.visible { display: block; }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: var(--gap);
    }

    .card-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* Portfolio Value */
    #portfolio-value {
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    /* Holdings table */
    .holdings-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .holding-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface2);
      border-radius: 8px;
    }

    .holding-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .coin-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    .coin-symbol {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .coin-price {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .coin-value {
      font-weight: 600;
      font-size: 0.95rem;
      text-align: right;
    }

    /* Alerts */
    .alerts-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .alert-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(255, 170, 0, 0.07);
      border: 1px solid rgba(255, 170, 0, 0.25);
      border-radius: 8px;
    }

    .alert-symbol {
      font-weight: 600;
      color: var(--warn);
    }

    .empty-state {
      color: var(--text-muted);
      font-size: 0.875rem;
      text-align: center;
      padding: 12px 0;
    }

    /* Buttons */
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-accent {
      background: var(--accent);
      color: #0d0d0d;
      padding: 9px 18px;
      font-size: 0.875rem;
      min-height: 40px;
    }
    .btn-accent:hover:not(:disabled) { opacity: 0.88; }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 7px 14px;
      font-size: 0.8rem;
      min-height: 36px;
    }
    .btn-outline:hover:not(:disabled) { background: var(--accent-dim); }

    .btn-danger-outline {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 7px 14px;
      font-size: 0.8rem;
      min-height: 36px;
    }
    .btn-danger-outline:hover:not(:disabled) { background: rgba(255, 77, 106, 0.1); }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.75rem;
      min-height: 28px;
    }

    /* Monitoring controls */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .status-pill.running {
      background: rgba(0, 255, 200, 0.1);
      color: var(--accent);
    }
    .status-pill.paused {
      background: rgba(255, 170, 0, 0.1);
      color: var(--warn);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .status-pill.running .status-dot { background: var(--accent); }
    .status-pill.paused .status-dot { background: var(--warn); }

    /* Thresholds */
    .threshold-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .threshold-card {
      background: var(--surface2);
      border-radius: 10px;
      padding: 14px;
    }

    .threshold-coin-header {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--accent);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2e2e2e;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 7px 0;
      border-bottom: 1px solid #242424;
    }
    .ctrl-row:last-child { border-bottom: none; }

    .ctrl-label {
      font-size: 0.75rem;
      font-weight: 600;
      min-width: 96px;
      color: var(--text-muted);
    }

    .ctrl-info {
      font-size: 0.78rem;
      color: var(--text);
      flex: 1;
      min-width: 100px;
    }
    .ctrl-info.muted { color: var(--text-muted); font-style: italic; }

    .threshold-input {
      background: var(--surface);
      border: 1px solid #333;
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 6px 8px;
      width: 80px;
      text-align: right;
      min-height: 34px;
    }
    .threshold-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .pct-label {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .pnl-positive { color: #00ffc8; }
    .pnl-negative { color: var(--danger); }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid #333;
      color: var(--text);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      transition: transform 0.25s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--accent); color: var(--accent); }
    .toast.error { border-color: var(--danger); color: var(--danger); }

    /* ── Tabs ─────────────────────────────────────────────────────────────── */
    .tab-nav { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab-btn { background: var(--surface); color: var(--text-muted); border: none; padding: 8px 18px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: var(--accent); color: #0d0d0d; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── Journal stats row ────────────────────────────────────────────────── */
    .j-stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    @media(max-width:600px) { .j-stats-row { grid-template-columns: repeat(2,1fr); } }
    .j-stat-card { background: var(--surface); border-radius: var(--radius); padding: 14px; text-align: center; }
    .j-stat-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 6px; }
    .j-stat-value { font-size: 1.6rem; font-weight: 700; color: var(--accent); }

    /* ── Journal entries ──────────────────────────────────────────────────── */
    .journal-entry { background: var(--surface2); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .je-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .je-action { padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .je-action.buy { background: rgba(0,255,200,0.15); color: var(--accent); }
    .je-action.sell { background: rgba(255,77,106,0.15); color: var(--danger); }
    .je-action.hold, .je-action.add, .je-action.reduce { background: rgba(255,170,0,0.12); color: var(--warn); }
    .je-coin { font-weight: 700; font-size: 0.95rem; }
    .je-price { color: var(--text-muted); font-size: 0.82rem; }
    .je-emotion { font-size: 0.72rem; color: var(--text-muted); padding: 2px 7px; border: 1px solid #333; border-radius: 20px; }
    .je-pnl { font-size: 0.82rem; font-weight: 600; }
    .je-pnl.pos { color: var(--accent); }
    .je-pnl.neg { color: var(--danger); }

    /* ── Outcome form ─────────────────────────────────────────────────────── */
    .outcome-form { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #2e2e2e; }
    .outcome-form.open { display: block; }
    .outcome-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* ── Emotion buttons ──────────────────────────────────────────────────── */
    .emotion-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .emotion-btn { background: var(--surface2); color: var(--text-muted); border: 1px solid #333; padding: 5px 11px; border-radius: 20px; font-size: 0.78rem; cursor: pointer; }
    .emotion-btn.selected { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    /* ── Action toggle ────────────────────────────────────────────────────── */
    .action-group { display: flex; gap: 4px; flex-wrap: wrap; }
    .action-btn { background: var(--surface2); color: var(--text-muted); border: 1px solid #333; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
    .action-btn.selected { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    /* ── Form fields ──────────────────────────────────────────────────────── */
    .form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .form-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
    .form-input { background: var(--surface2); border: 1px solid #333; border-radius: 8px; color: var(--text); font-family: inherit; font-size: 0.88rem; padding: 8px 10px; width: 100%; }
    .form-input:focus { outline: none; border-color: var(--accent); }
    .form-textarea { min-height: 60px; resize: vertical; }

    /* ── Profile list ─────────────────────────────────────────────────────── */
    .profile-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #222; font-size: 0.85rem; }
    .profile-item:last-child { border-bottom: none; }

    /* ── Learning model text ──────────────────────────────────────────────── */
    .learning-text { font-size: 0.85rem; line-height: 1.7; color: var(--text); white-space: pre-wrap; }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .card { padding: 14px; }
      .threshold-row { flex-direction: column; align-items: flex-start; }
      .threshold-input-wrap { width: 100%; }
      .threshold-input { flex: 1; width: auto; }
    }
  </style>
</head>
<body>

<header>
  <h1>⚡ Revolut X</h1>
  <div class="status-bar">
    <div class="spinner" id="spinner"></div>
    <span id="last-updated">Loading…</span>
  </div>
</header>

<!-- Tab navigation -->
<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('portfolio')">Portfolio</button>
  <button class="tab-btn" onclick="switchTab('journal')">📓 Journal</button>
</nav>

<div class="error-banner" id="error-banner"></div>

<!-- ════════════════════════════════════ PORTFOLIO TAB ═══════════════════ -->
<div id="tab-portfolio" class="tab-content active">

  <!-- Portfolio Value -->
  <div class="card">
    <div class="card-title">Portfolio Value</div>
    <div id="portfolio-value">—</div>
  </div>

  <!-- Holdings -->
  <div class="card">
    <div class="card-title">Holdings</div>
    <div class="holdings-list" id="holdings-list">
      <div class="empty-state">Loading…</div>
    </div>
  </div>

  <!-- Active Alerts -->
  <div class="card">
    <div class="card-title">Active Alerts</div>
    <div class="alerts-list" id="alerts-list">
      <div class="empty-state">None</div>
    </div>
  </div>

  <!-- Monitoring Controls -->
  <div class="card">
    <div class="card-title">Monitoring Controls</div>
    <div class="controls-row">
      <div class="status-pill running" id="monitor-status-pill">
        <div class="status-dot"></div>
        <span id="monitor-status-text">Running</span>
      </div>
      <button class="btn-accent" id="pause-resume-btn" onclick="toggleMonitoring()">Pause</button>
    </div>
  </div>

  <!-- Thresholds -->
  <div class="card">
    <div class="card-title">Alert Thresholds</div>
    <div class="threshold-list" id="threshold-list">
      <div class="empty-state">Loading…</div>
    </div>
  </div>

</div><!-- /tab-portfolio -->

<!-- ════════════════════════════════════ JOURNAL TAB ════════════════════ -->
<div id="tab-journal" class="tab-content">

  <!-- Stats row -->
  <div class="j-stats-row">
    <div class="j-stat-card">
      <div class="j-stat-label">Win Rate</div>
      <div class="j-stat-value" id="j-win-rate">—</div>
    </div>
    <div class="j-stat-card">
      <div class="j-stat-label">Total Trades</div>
      <div class="j-stat-value" id="j-total-trades">—</div>
    </div>
    <div class="j-stat-card">
      <div class="j-stat-label">Avg Profit</div>
      <div class="j-stat-value" id="j-avg-profit" style="color:var(--accent)">—</div>
    </div>
    <div class="j-stat-card">
      <div class="j-stat-label">Claude Accuracy</div>
      <div class="j-stat-value" id="j-claude-acc">—</div>
    </div>
  </div>

  <!-- Learning Model -->
  <div class="card">
    <div class="card-title">🧠 Learning Model</div>
    <div class="learning-text" id="learning-text">Loading…</div>
  </div>

  <!-- Add Trade form -->
  <div class="card">
    <div class="card-title">Log a Trade</div>

    <div class="form-row">
      <label class="form-label">Coin</label>
      <input class="form-input" type="text" id="j-coin" placeholder="CC, SOL, HYPE…" maxlength="10" />
    </div>

    <div class="form-row">
      <label class="form-label">Action</label>
      <div class="action-group" id="j-action-group">
        <button class="action-btn" onclick="selectAction('buy')">Buy</button>
        <button class="action-btn" onclick="selectAction('sell')">Sell</button>
        <button class="action-btn" onclick="selectAction('hold')">Hold</button>
        <button class="action-btn" onclick="selectAction('add')">Add</button>
        <button class="action-btn" onclick="selectAction('reduce')">Reduce</button>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">Price (USD)</label>
      <input class="form-input" type="number" id="j-price" placeholder="0.00" step="any" min="0" />
    </div>

    <div class="form-row">
      <label class="form-label">Quantity (optional)</label>
      <input class="form-input" type="number" id="j-qty" placeholder="0" step="any" min="0" />
    </div>

    <div class="form-row">
      <label class="form-label">Reasoning (optional)</label>
      <textarea class="form-input form-textarea" id="j-reasoning" placeholder="Why this trade?"></textarea>
    </div>

    <div class="form-row">
      <label class="form-label">Emotion</label>
      <div class="emotion-group" id="j-emotion-group">
        <button class="emotion-btn" onclick="selectEmotion('confident')">Confident</button>
        <button class="emotion-btn" onclick="selectEmotion('uncertain')">Uncertain</button>
        <button class="emotion-btn" onclick="selectEmotion('fomo')">FOMO</button>
        <button class="emotion-btn" onclick="selectEmotion('fearful')">Fearful</button>
        <button class="emotion-btn" onclick="selectEmotion('neutral')">Neutral</button>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">Followed Claude's Recommendation?</label>
      <div class="action-group" id="j-followed-group">
        <button class="action-btn" onclick="selectFollowed('yes')">Yes</button>
        <button class="action-btn" onclick="selectFollowed('no')">No</button>
        <button class="action-btn selected" onclick="selectFollowed('na')">N/A</button>
      </div>
    </div>

    <button class="btn-accent" onclick="submitJournalEntry()">Log Trade</button>
  </div>

  <!-- Journal entries -->
  <div class="card">
    <div class="card-title">Recent Trades</div>
    <div id="journal-entries-list">
      <div class="empty-state">Loading…</div>
    </div>
  </div>

  <!-- Trader Profile -->
  <div class="card">
    <div class="card-title">Trader Profile</div>
    <div id="profile-list">
      <div class="empty-state">No preferences saved yet.</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
      <input class="form-input" type="text" id="pref-input" placeholder="e.g. I prefer swing trading over day trading" style="flex:1;min-width:180px;" />
      <button class="btn-outline" onclick="addPreference()">Add</button>
    </div>
  </div>

</div><!-- /tab-journal -->

<div class="toast" id="toast"></div>

<script>
  const BASE = window.location.origin;
  const REFRESH_MS = 5 * 60 * 1000;

  let balancesData = [];
  let statusData = {};
  let targetsData = {};
  let entryPricesData = {};

  window.journalLoaded = false;

  // ── Helpers ──────────────────────────────────────────────────────────────

  function fmt(usd) {
    if (usd == null) return '—';
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(usd);
  }

  function fmtPrice(p) {
    if (p == null) return '—';
    if (p >= 1000) return '$' + p.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (p >= 1) return '$' + p.toFixed(4);
    return '$' + p.toFixed(6);
  }

  function setLoading(on) {
    document.getElementById('spinner').classList.toggle('active', on);
  }

  function showError(msg) {
    const el = document.getElementById('error-banner');
    if (msg) { el.textContent = msg; el.classList.add('visible'); }
    else { el.classList.remove('visible'); }
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.className = 'toast'; }, 2800);
  }

  async function apiFetch(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(BASE + path, opts);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  // ── Tab switching ─────────────────────────────────────────────────────────

  function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    event.currentTarget.classList.add('active');

    if (tab === 'journal' && !window.journalLoaded) {
      window.journalLoaded = true;
      loadJournalStats();
      loadLearning();
      loadJournal();
      loadProfile();
    }
  }

  // ── Portfolio Render ──────────────────────────────────────────────────────

  function renderHoldings(balances) {
    const el = document.getElementById('holdings-list');
    if (!balances || balances.length === 0) {
      el.innerHTML = '<div class="empty-state">No holdings found.</div>';
      return;
    }
    const sorted = [...balances].sort((a, b) => (b.valueUSD || 0) - (a.valueUSD || 0));
    el.innerHTML = sorted.map(h => `
      <div class="holding-row">
        <div class="holding-left">
          <div class="coin-icon">${h.currency.slice(0, 3)}</div>
          <div>
            <div class="coin-symbol">${h.currency}</div>
            <div class="coin-price">${fmtPrice(h.price)}</div>
          </div>
        </div>
        <div class="coin-value">${fmt(h.valueUSD)}</div>
      </div>
    `).join('');
  }

  function renderAlerts(activeAlerts) {
    const el = document.getElementById('alerts-list');
    const symbols = Object.keys(activeAlerts || {});
    if (symbols.length === 0) {
      el.innerHTML = '<div class="empty-state">No active alerts 🎉</div>';
      return;
    }
    el.innerHTML = symbols.map(sym => `
      <div class="alert-row">
        <span class="alert-symbol">🚀 ${sym}</span>
        <button class="btn-danger-outline" onclick="acknowledge('${sym}')">Acknowledge</button>
      </div>
    `).join('');
  }

  function renderMonitorStatus(paused) {
    const pill = document.getElementById('monitor-status-pill');
    const text = document.getElementById('monitor-status-text');
    const btn = document.getElementById('pause-resume-btn');
    if (paused) {
      pill.className = 'status-pill paused';
      text.textContent = 'Paused';
      btn.textContent = 'Resume';
    } else {
      pill.className = 'status-pill running';
      text.textContent = 'Running';
      btn.textContent = 'Pause';
    }
  }

  function renderThresholds(balances, status, targets, entries) {
    const el = document.getElementById('threshold-list');
    const coins = (balances || []).filter(b => !['USD','USDT','USDC','EUR','GBP'].includes(b.currency));
    if (coins.length === 0) {
      el.innerHTML = '<div class="empty-state">No coins to configure.</div>';
      return;
    }
    const defaultPct = ((status.defaultThreshold || 0.20) * 100).toFixed(0);

    el.innerHTML = coins.map(h => {
      const sym = h.symbol || `${h.currency}-USD`;
      const coin = h.currency;

      // ── Daily threshold ──
      const custom = status.customThresholds && status.customThresholds[sym] !== undefined;
      const dailyPct = custom ? (status.customThresholds[sym] * 100).toFixed(1) : defaultPct;
      const dailyInfo = custom ? `${dailyPct}% (custom)` : `${dailyPct}% (default)`;

      // ── Fixed target ──
      const tgt = targets[sym];
      let targetSection;
      if (tgt) {
        targetSection = `
          <div class="ctrl-row">
            <span class="ctrl-label">🎯 Fixed Target</span>
            <span class="ctrl-info">${fmtPrice(tgt.anchorPrice)} + ${tgt.thresholdPct}% = ${fmtPrice(tgt.targetPrice)}</span>
            <input class="threshold-input" type="number" id="ftpct-${coin}" value="${tgt.thresholdPct}" min="0.1" max="500" step="0.1" style="width:70px" />
            <span class="pct-label">%</span>
            <button class="btn-outline" onclick="updateTarget('${sym}','${coin}')">Update</button>
            <button class="btn-danger-outline" onclick="removeTarget('${sym}')">Remove</button>
          </div>`;
      } else {
        targetSection = `
          <div class="ctrl-row">
            <span class="ctrl-label">🎯 Fixed Target</span>
            <span class="ctrl-info muted">Not set</span>
            <input class="threshold-input" type="number" id="ftpct-${coin}" placeholder="%" min="0.1" max="500" step="0.1" style="width:70px" />
            <span class="pct-label">% from now</span>
            <button class="btn-outline" onclick="setTarget('${sym}','${coin}')">Set Target</button>
          </div>`;
      }

      // ── Avg entry ──
      const entry = entries[sym];
      let entrySection;
      if (entry) {
        const pnl = h.price ? ((h.price - entry) / entry * 100) : null;
        const pnlClass = pnl != null ? (pnl >= 0 ? 'pnl-positive' : 'pnl-negative') : '';
        const pnlStr = pnl != null ? `<span class="${pnlClass}">${pnl >= 0 ? '+' : ''}${pnl.toFixed(1)}% ${pnl >= 0 ? '🟢' : '🔴'}</span>` : '';
        entrySection = `
          <div class="ctrl-row">
            <span class="ctrl-label">📍 Avg Entry</span>
            <span class="ctrl-info">Entry: ${fmtPrice(entry)} → Now: ${fmtPrice(h.price)} ${pnlStr}</span>
            <input class="threshold-input" type="number" id="entry-${coin}" value="${entry}" min="0.000001" step="any" style="width:90px" />
            <button class="btn-outline" onclick="setEntryPrice('${sym}','${coin}')">Update</button>
          </div>`;
      } else {
        entrySection = `
          <div class="ctrl-row">
            <span class="ctrl-label">📍 Avg Entry</span>
            <span class="ctrl-info muted">Not set</span>
            <input class="threshold-input" type="number" id="entry-${coin}" placeholder="$0.00" min="0.000001" step="any" style="width:90px" />
            <button class="btn-outline" onclick="setEntryPrice('${sym}','${coin}')">Set</button>
          </div>`;
      }

      return `
        <div class="threshold-card">
          <div class="threshold-coin-header">${coin}</div>
          <div class="ctrl-row">
            <span class="ctrl-label">📅 Daily Alert</span>
            <span class="ctrl-info muted">${dailyInfo}</span>
            <input class="threshold-input" type="number" id="thresh-${coin}" value="${dailyPct}" min="1" max="999" step="0.5" style="width:70px" />
            <span class="pct-label">%</span>
            <button class="btn-outline" onclick="setThreshold('${sym}','${coin}')">Set</button>
          </div>
          ${targetSection}
          ${entrySection}
        </div>`;
    }).join('');
  }

  // ── Portfolio API Actions ──────────────────────────────────────────────────

  async function acknowledge(symbol) {
    try {
      await apiFetch('POST', `/api/acknowledge/${symbol}`);
      showToast(`Acknowledged ${symbol}`, 'success');
      await refreshStatus();
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    }
  }

  async function toggleMonitoring() {
    const btn = document.getElementById('pause-resume-btn');
    btn.disabled = true;
    try {
      const paused = statusData.paused;
      await apiFetch('POST', paused ? '/api/resume' : '/api/pause');
      showToast(paused ? 'Monitoring resumed' : 'Monitoring paused', 'success');
      await refreshStatus();
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  async function setThreshold(symbol, coin) {
    const pct = parseFloat(document.getElementById(`thresh-${coin}`).value);
    if (!pct || pct <= 0) { showToast('Enter a valid % > 0', 'error'); return; }
    try {
      await apiFetch('POST', `/api/threshold/${symbol}`, { threshold: pct / 100 });
      showToast(`${symbol} daily alert set to ${pct}%`, 'success');
      await refreshStatus();
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    }
  }

  async function setTarget(symbol, coin) {
    const pct = parseFloat(document.getElementById(`ftpct-${coin}`).value);
    if (!pct || pct <= 0) { showToast('Enter a valid % > 0', 'error'); return; }
    try {
      await apiFetch('POST', `/api/targets/${symbol}`, { threshold_pct: pct });
      showToast(`${symbol} fixed target set to +${pct}% from current price`, 'success');
      targetsData = await apiFetch('GET', '/api/targets');
      renderThresholds(balancesData, statusData, targetsData, entryPricesData);
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    }
  }

  async function updateTarget(symbol, coin) {
    const pct = parseFloat(document.getElementById(`ftpct-${coin}`).value);
    if (!pct || pct <= 0) { showToast('Enter a valid % > 0', 'error'); return; }
    try {
      await apiFetch('POST', `/api/targets/${symbol}`, { threshold_pct: pct });
      showToast(`${symbol} fixed target updated to ${pct}%`, 'success');
      targetsData = await apiFetch('GET', '/api/targets');
      renderThresholds(balancesData, statusData, targetsData, entryPricesData);
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    }
  }

  async function removeTarget(symbol) {
    try {
      await apiFetch('DELETE', `/api/targets/${symbol}`);
      showToast(`${symbol} fixed target removed`, 'success');
      targetsData = await apiFetch('GET', '/api/targets');
      renderThresholds(balancesData, statusData, targetsData, entryPricesData);
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    }
  }

  async function setEntryPrice(symbol, coin) {
    const price = parseFloat(document.getElementById(`entry-${coin}`).value);
    if (!price || price <= 0) { showToast('Enter a valid price > 0', 'error'); return; }
    try {
      await apiFetch('POST', `/api/entryprices/${symbol}`, { entry_price: price });
      showToast(`${symbol} entry price set to $${price}`, 'success');
      entryPricesData = await apiFetch('GET', '/api/entryprices');
      renderThresholds(balancesData, statusData, targetsData, entryPricesData);
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    }
  }

  // ── Portfolio Data Fetching ───────────────────────────────────────────────

  async function refreshBalances() {
    const data = await apiFetch('GET', '/api/balances');
    balancesData = data.balances || [];
    document.getElementById('portfolio-value').textContent = fmt(data.totalUSD);
    renderHoldings(balancesData);
    return balancesData;
  }

  async function refreshStatus() {
    const data = await apiFetch('GET', '/api/status');
    statusData = data;
    renderAlerts(data.activeAlerts);
    renderMonitorStatus(data.paused);
    renderThresholds(balancesData, statusData, targetsData, entryPricesData);
    return data;
  }

  async function refreshAll() {
    setLoading(true);
    showError('');
    try {
      await refreshBalances();
      const [status, targets, entries] = await Promise.all([
        apiFetch('GET', '/api/status'),
        apiFetch('GET', '/api/targets'),
        apiFetch('GET', '/api/entryprices'),
      ]);
      statusData = status;
      targetsData = targets;
      entryPricesData = entries;
      renderAlerts(status.activeAlerts);
      renderMonitorStatus(status.paused);
      renderThresholds(balancesData, statusData, targetsData, entryPricesData);
      const now = new Date();
      document.getElementById('last-updated').textContent =
        'Updated ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch (e) {
      showError('Failed to load data: ' + e.message + '. Is the server running?');
      document.getElementById('last-updated').textContent = 'Update failed';
    } finally {
      setLoading(false);
    }
  }

  // ── Journal Form State ────────────────────────────────────────────────────

  let selectedAction = null;
  let selectedEmotion = null;
  let selectedFollowed = 'na';

  function selectAction(action) {
    selectedAction = action;
    document.querySelectorAll('#j-action-group .action-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.textContent.toLowerCase() === action);
    });
  }

  function selectEmotion(emotion) {
    selectedEmotion = emotion;
    document.querySelectorAll('#j-emotion-group .emotion-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.textContent.toLowerCase() === emotion);
    });
  }

  function selectFollowed(val) {
    selectedFollowed = val;
    document.querySelectorAll('#j-followed-group .action-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.textContent.toLowerCase() === val);
    });
  }

  // ── Journal Functions ─────────────────────────────────────────────────────

  async function loadJournalStats() {
    try {
      const stats = await apiFetch('GET', '/api/journal/stats');
      const winRateEl = document.getElementById('j-win-rate');
      winRateEl.textContent = stats.win_rate != null ? stats.win_rate + '%' : '—';
      winRateEl.style.color = stats.win_rate >= 50 ? 'var(--accent)' : 'var(--danger)';
      document.getElementById('j-total-trades').textContent = stats.total_trades ?? '—';
      const profitEl = document.getElementById('j-avg-profit');
      profitEl.textContent = stats.avg_profit != null ? '+' + stats.avg_profit + '%' : '—';
      const accEl = document.getElementById('j-claude-acc');
      const fw = stats.recommendation_accuracy?.followed_win_rate;
      accEl.textContent = fw != null ? fw + '%' : '—';
    } catch (e) {
      console.error('loadJournalStats:', e.message);
    }
  }

  async function loadLearning() {
    try {
      const data = await apiFetch('GET', '/api/learning');
      const el = document.getElementById('learning-text');
      if (data.summary) {
        el.textContent = data.summary;
      } else {
        el.textContent = 'No learning data yet — log some trades with outcomes first.';
        el.style.color = 'var(--text-muted)';
      }
    } catch (e) {
      document.getElementById('learning-text').textContent = 'Failed to load learning model.';
    }
  }

  async function loadJournal() {
    try {
      const entries = await apiFetch('GET', '/api/journal');
      renderJournalEntries(entries);
    } catch (e) {
      document.getElementById('journal-entries-list').innerHTML = '<div class="empty-state">Failed to load journal.</div>';
    }
  }

  function renderJournalEntries(entries) {
    const el = document.getElementById('journal-entries-list');
    if (!entries || entries.length === 0) {
      el.innerHTML = '<div class="empty-state">No trades logged yet. Use the form above or Telegram commands.</div>';
      return;
    }
    el.innerHTML = entries.map(e => {
      const coin = e.symbol ? e.symbol.replace('-USD', '') : '?';
      const actionClass = (e.action || 'hold').toLowerCase();
      const price = e.price ? '$' + parseFloat(e.price).toFixed(4) : '—';
      const emotion = e.emotion ? `<span class="je-emotion">${e.emotion}</span>` : '';
      let pnlBadge = '';
      if (e.outcome_pnl != null) {
        const pnl = parseFloat(e.outcome_pnl);
        pnlBadge = `<span class="je-pnl ${pnl >= 0 ? 'pos' : 'neg'}">${pnl >= 0 ? '+' : ''}${pnl.toFixed(1)}%</span>`;
      }
      const outcomeBtn = e.outcome == null
        ? `<button class="btn-outline btn-sm" onclick="toggleOutcomeForm(${e.id})">Log Outcome</button>`
        : `<span style="font-size:0.75rem;color:var(--text-muted)">${e.outcome}</span>`;
      const date = e.created_at ? new Date(e.created_at).toLocaleDateString() : '';
      return `
        <div class="journal-entry" id="je-${e.id}">
          <div class="je-header">
            <span class="je-action ${actionClass}">${e.action || '?'}</span>
            <span class="je-coin">${coin}</span>
            <span class="je-price">${price}</span>
            ${emotion}
            ${pnlBadge}
            <span style="margin-left:auto;font-size:0.72rem;color:var(--text-muted)">${date}</span>
            ${outcomeBtn}
          </div>
          ${e.reasoning ? `<div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px">${e.reasoning}</div>` : ''}
          <div class="outcome-form" id="outcome-form-${e.id}">
            <div class="outcome-row">
              <input class="form-input" type="number" id="op-${e.id}" placeholder="Exit price" step="any" min="0" style="width:130px" />
              <select class="form-input" id="oo-${e.id}" style="width:130px">
                <option value="">Outcome…</option>
                <option value="profit">Profit</option>
                <option value="loss">Loss</option>
                <option value="break-even">Break-even</option>
              </select>
              <input class="form-input" type="text" id="on-${e.id}" placeholder="Notes (optional)" style="flex:1;min-width:120px" />
              <button class="btn-accent btn-sm" onclick="logOutcome(${e.id})">Save</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function toggleOutcomeForm(id) {
    const form = document.getElementById('outcome-form-' + id);
    form.classList.toggle('open');
  }

  async function logOutcome(id) {
    const outcomePrice = parseFloat(document.getElementById('op-' + id).value);
    const outcome = document.getElementById('oo-' + id).value;
    const notes = document.getElementById('on-' + id).value;
    if (!outcomePrice || outcomePrice <= 0) { showToast('Enter a valid exit price', 'error'); return; }
    try {
      await apiFetch('POST', `/api/journal/${id}/outcome`, { outcome_price: outcomePrice, outcome, outcome_notes: notes });
      showToast('Outcome saved!', 'success');
      await loadJournal();
      await loadJournalStats();
      await loadLearning();
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    }
  }

  async function submitJournalEntry() {
    const coin = document.getElementById('j-coin').value.trim().toUpperCase();
    if (!coin) { showToast('Enter a coin symbol', 'error'); return; }
    if (!selectedAction) { showToast('Select an action', 'error'); return; }
    const price = parseFloat(document.getElementById('j-price').value) || null;
    const qty = parseFloat(document.getElementById('j-qty').value) || null;
    const reasoning = document.getElementById('j-reasoning').value.trim() || null;
    const followed = selectedFollowed === 'yes' ? true : selectedFollowed === 'no' ? false : null;
    try {
      await apiFetch('POST', '/api/journal/entry', {
        symbol: coin,
        action: selectedAction,
        price,
        quantity: qty,
        reasoning,
        emotion: selectedEmotion,
        followed_recommendation: followed
      });
      showToast('Trade logged!', 'success');
      // Reset form
      document.getElementById('j-coin').value = '';
      document.getElementById('j-price').value = '';
      document.getElementById('j-qty').value = '';
      document.getElementById('j-reasoning').value = '';
      selectedAction = null;
      selectedEmotion = null;
      selectedFollowed = 'na';
      document.querySelectorAll('.action-btn, .emotion-btn').forEach(b => b.classList.remove('selected'));
      document.querySelectorAll('#j-followed-group .action-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.textContent.toLowerCase() === 'na');
      });
      await loadJournal();
      await loadJournalStats();
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    }
  }

  // ── Profile Functions ─────────────────────────────────────────────────────

  async function loadProfile() {
    try {
      const rows = await apiFetch('GET', '/api/profile');
      const el = document.getElementById('profile-list');
      if (!rows || rows.length === 0) {
        el.innerHTML = '<div class="empty-state">No preferences saved yet.</div>';
        return;
      }
      el.innerHTML = rows.map(r => `
        <div class="profile-item">
          <span>${r.preference_value}</span>
        </div>
      `).join('');
    } catch (e) {
      console.error('loadProfile:', e.message);
    }
  }

  async function addPreference() {
    const val = document.getElementById('pref-input').value.trim();
    if (!val) { showToast('Enter a preference', 'error'); return; }
    try {
      await apiFetch('POST', '/api/profile', { key: 'pref_' + Date.now(), value: val });
      document.getElementById('pref-input').value = '';
      showToast('Preference saved!', 'success');
      await loadProfile();
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────

  refreshAll();
  setInterval(refreshAll, REFRESH_MS);
</script>
</body>
</html>
