name: Deploy Approved Spec

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: 'Ticket ID to deploy (e.g., Dev-263)'
        required: true
        type: string
      confirm_ticket:
        description: 'Retype the SAME ticket ID to confirm Claude has reviewed it'
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract, Patch, and Verify
        env:
          TICKET_ID: ${{ inputs.ticket_id }}
          CONFIRM_TICKET: ${{ inputs.confirm_ticket }}
        run: |
          node --input-type=module << 'NODEEOF'
          import fs from 'fs';
          import path from 'path';
          import crypto from 'crypto';
          import { execSync } from 'child_process';

          const ticketId = (process.env.TICKET_ID || '').trim();
          const confirm  = (process.env.CONFIRM_TICKET || '').trim();

          // GATE 0 - deliberate confirmation. Guards against an accidental run.
          if (ticketId !== confirm) {
            console.error('ABORT: confirm_ticket does not match ticket_id.');
            process.exit(1);
          }

          // NO AUTOMATED REVIEW GATE - deliberate. An earlier APPROVED_BY check was
          // REMOVED because the spec header's own reminder text satisfied it, so it
          // passed on every spec. A gate that blocks nothing while reading as
          // protection is worse than none.
          console.log('Review gate: operator confirmation only (by design).');

          const specPath = path.join('specs/gemini-proposals', ticketId + '.md');
          if (!fs.existsSync(specPath)) {
            console.error('ABORT: spec not found at ' + specPath);
            process.exit(1);
          }
          const spec = fs.readFileSync(specPath, 'utf8');

          // TARGET FILE comes from the spec header, so the deployer patches whatever
          // the spec was drafted against. Defaults to server.js for older specs.
          const tf = spec.match(/^TARGET_FILE:\s*(\S+)\s*$/m);
          const target = tf ? tf[1] : 'server.js';
          if (target.indexOf('..') !== -1 || target.startsWith('/') || target.startsWith('.github/')) {
            console.error('ABORT: refusing to patch ' + target);
            process.exit(1);
          }
          if (!fs.existsSync(target)) {
            console.error('ABORT: target file not found: ' + target);
            process.exit(1);
          }
          console.log('Target file: ' + target);

          let fileCode = fs.readFileSync(target, 'utf8').replace(/\r\n/g, '\n');

          // GATE 1 - BASE DRIFT. Warning, not abort: main legitimately advances
          // between drafting and deploy. Anchor uniqueness below is the real guard.
          const baseSha = spec.match(/BASE_SHA:\s*([0-9a-f]{64})/);
          if (baseSha) {
            const nowSha = crypto.createHash('sha256').update(fileCode).digest('hex');
            if (nowSha !== baseSha[1]) {
              console.log('WARNING: ' + target + ' has changed since this spec was drafted.');
              console.log('  drafted against: ' + baseSha[1].slice(0, 12));
              console.log('  current:         ' + nowSha.slice(0, 12));
              console.log('  Proceeding - every anchor must still match exactly once.');
            } else {
              console.log('Base sha matches the drafted version.');
            }
          } else {
            console.log('NOTE: spec carries no BASE_SHA (older spec-writer).');
          }

          // GATE 2 - MULTI-BLOCK. matchAll, not match. An earlier version took only
          // the FIRST pair, so a multi-part patch applied PARTIALLY and reported
          // success - the worst outcome available.
          const grab = (label) => [...spec.matchAll(
            new RegExp(label + ':\\s*```text\\s*([A-Za-z0-9+/=\\s]+?)\\s*```', 'g')
          )].map(m => Buffer.from(m[1].replace(/\s+/g, ''), 'base64').toString('utf8').replace(/\r\n/g, '\n'));

          const searches = grab('SEARCH_BASE64');
          const replaces = grab('REPLACE_BASE64');

          if (!searches.length) {
            console.error('ABORT: no SEARCH_BASE64 blocks found.');
            process.exit(1);
          }
          if (searches.length !== replaces.length) {
            console.error('ABORT: ' + searches.length + ' SEARCH blocks vs ' + replaces.length + ' REPLACE blocks.');
            process.exit(1);
          }
          console.log('Found ' + searches.length + ' patch block(s).');

          // ATOMIC: every block applies IN MEMORY. If any anchor fails, nothing is
          // written and nothing is committed. A half-applied patch leaves the file
          // in a state nobody designed.
          for (let i = 0; i < searches.length; i++) {
            const hits = fileCode.split(searches[i]).length - 1;
            if (hits !== 1) {
              console.error('ABORT on block ' + (i + 1) + '/' + searches.length + ': anchor matched ' + hits + ' times, must be exactly 1.');
              console.error('Nothing written. ' + target + ' is untouched.');
              process.exit(1);
            }
            const before = fileCode.length;

            // GATE 3 - REPLACER FUNCTION, NOT A STRING. In JS, $' $& $` and $$ inside
            // a replacement STRING are special: $' means "everything after the match".
            // A Dev-314 block contained `floor $'` - a dollar before a closing quote,
            // ubiquitous in price-formatting code - and the string form spliced the
            // ENTIRE REST OF THE FILE in at that point, taking server.js from 1.07 MB
            // to 5.55 MB. A function's return value is used LITERALLY. See #328.
            // Never revert this to the string form.
            fileCode = fileCode.replace(searches[i], () => replaces[i]);

            // Belt and braces: the size change must equal replace.length - search.length.
            // Any other delta means something expanded and the patch is not what was reviewed.
            const delta = fileCode.length - before;
            const expect = replaces[i].length - searches[i].length;
            if (delta !== expect) {
              console.error('ABORT on block ' + (i + 1) + ': size delta ' + delta + ' but expected ' + expect + '.');
              console.error('Something expanded during replacement. Nothing committed.');
              process.exit(1);
            }
            console.log('  block ' + (i + 1) + ' applied (delta ' + delta + ')');
          }

          fs.writeFileSync(target, fileCode);

          // Syntax gate applies to JavaScript only. A .md file has no parser, so the
          // anchor-uniqueness and size-delta gates above are its whole protection -
          // which is acceptable because docs are not an execution path.
          if (target.endsWith('.js')) {
            try {
              execSync('node --check ' + target, { stdio: 'inherit' });
              console.log('Syntax check passed.');
            } catch (err) {
              console.error('ABORT: syntax check failed. Not committing.');
              process.exit(1);
            }
          } else {
            console.log('Non-JS target - syntax check skipped.');
          }

          const finalSha = crypto.createHash('sha256').update(fileCode).digest('hex');
          console.log('POST-SHA: ' + finalSha);
          console.log('Give this to Claude to verify what landed.');
          NODEEOF

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No change to commit."; exit 1; }
          git commit -m "Deploy Spec: ${{ inputs.ticket_id }}"
          git push
