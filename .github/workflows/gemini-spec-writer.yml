name: Gemini Spec Writer

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: 'Ticket ID (e.g., Dev-263)'
        required: true
        type: string
      instructions:
        description: 'What to change and why'
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Google Gen AI SDK
        run: npm install @google/genai

      - name: Generate Spec via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TICKET_ID: ${{ inputs.ticket_id }}
          INSTRUCTIONS: ${{ inputs.instructions }}
          BASE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module << 'EOF'
          import { GoogleGenAI } from '@google/genai';
          import fs from 'fs';
          import path from 'path';
          import crypto from 'crypto';

          const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });

          if (!fs.existsSync('server.js')) {
            console.error('ABORT: server.js missing.');
            process.exit(1);
          }
          const serverCode = fs.readFileSync('server.js', 'utf8').replace(/\r\n/g, '\n');
          const baseSha = crypto.createHash('sha256').update(serverCode).digest('hex');

          const prompt = `You are drafting a surgical patch for a live crypto trading system.
Ticket: ${process.env.TICKET_ID}
Instructions: ${process.env.INSTRUCTIONS}

=== RULES - THESE ARE NOT STYLE PREFERENCES ===

1. VERIFY EVERY IDENTIFIER AGAINST THE CODE BELOW BEFORE YOU USE IT.
   You have the entire file. Search it. Do not assume a function, column,
   middleware or table exists because the name sounds right. Past drafts have
   referenced requireApiToken, sendTelegramAlert and tax_lots.status - none of
   which existed. This is the single most common defect in these specs, and it
   is always avoidable by searching the file you were given.

2. EACH SEARCH BLOCK MUST APPEAR EXACTLY ONCE IN server.js.
   Count the occurrences. If your anchor is not unique, widen it with
   surrounding lines until it is. A non-unique anchor aborts the deploy.
