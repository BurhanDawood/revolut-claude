name: Gemini Spec Writer

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: 'Ticket ID (e.g., Dev-263)'
        required: true
        type: string
      instructions:
        description: 'What to change and why'
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Google Gen AI SDK
        run: npm install @google/genai

      - name: Generate Spec via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TICKET_ID: ${{ inputs.ticket_id }}
          INSTRUCTIONS: ${{ inputs.instructions }}
          BASE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module << 'NODEEOF'
          import { GoogleGenAI } from '@google/genai';
          import fs from 'fs';
          import path from 'path';
          import crypto from 'crypto';

          const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });

          if (!fs.existsSync('server.js')) {
            console.error('ABORT: server.js missing.');
            process.exit(1);
          }
          const serverCode = fs.readFileSync('server.js', 'utf8').replace(/\r\n/g, '\n');
          const baseSha = crypto.createHash('sha256').update(serverCode).digest('hex');

          // Prompt assembled as an ARRAY, not a multi-line template literal.
          // A template literal spanning lines puts continuation lines at column 0,
          // which terminates the YAML block scalar and makes the whole workflow
          // file unparseable - that is exactly what broke run #3.
          const rules = [
            'You are drafting a surgical patch for a live crypto trading system.',
            'Ticket: ' + process.env.TICKET_ID,
            'Instructions: ' + process.env.INSTRUCTIONS,
            '',
            '=== RULES - NOT STYLE PREFERENCES ===',
            '',
            '1. VERIFY EVERY IDENTIFIER AGAINST THE CODE BELOW BEFORE USING IT.',
            '   You have the entire file. Search it. Do not assume a function, column,',
            '   middleware or table exists because the name sounds right. Past drafts',
            '   referenced requireApiToken, sendTelegramAlert and tax_lots.status -',
            '   none existed. This is the most common defect in these specs and it is',
            '   always avoidable by searching the file you were given.',
            '',
            '2. EACH SEARCH BLOCK MUST APPEAR EXACTLY ONCE IN server.js.',
            '   Count occurrences. If your anchor is not unique, widen it with',
            '   surrounding lines until it is. A non-unique anchor aborts the deploy.',
            '',
            '3. COPY SEARCH BLOCKS BYTE-FOR-BYTE, including indentation and blank',
            '   lines. Do not reformat, re-indent or tidy them.',
            '',
            '4. ONE BLOCK PAIR PER DISTINCT EDIT SITE. Several small unique anchors',
            '   are safer than one sprawling one. Blocks apply atomically - if any',
            '   anchor fails, none are applied.',
            '',
            '5. STATE WHAT YOU DID NOT CHECK. If unsure whether something is',
            '   reachable, or whether a caller depends on old behaviour, say so',
            '   plainly. Claude reviews this before deploy and an honest gap is far',
            '   more useful than false confidence.',
            '',
            '6. THIS IS A LIVE TRADING SYSTEM. Auto-execution moves real money. If',
            '   your change touches an execution path, say so and explain the blast',
            '   radius.',
            '',
            '=== OUTPUT FORMAT ===',
            '',
            'First prose in Markdown: the problem, what you changed, why, what you',
            'did NOT check, and the blast radius.',
            '',
            'Then one or more block pairs in exactly this form:',
            '',
            '<<<<<<< SEARCH',
            '[exact lines from server.js]',
            '=======',
            '[replacement lines]',
            '>>>>>>> REPLACE',
            '',
            'Do not base64 anything yourself - the runner computes it.',
            '',
            '=== CODEBASE (server.js) ===',
            serverCode
          ];

          const response = await ai.models.generateContent({
            model: 'gemini-3.6-flash',
            contents: rules.join('\n')
          });

          let out = response.text;

          // matchAll, not match: the original captured only the FIRST pair, so a
          // multi-part patch was truncated and applied partially as a "success".
          const blocks = [...out.matchAll(/<<<<<<< SEARCH\n([\s\S]*?)\n=======\n([\s\S]*?)\n>>>>>>> REPLACE/g)];

          const head = [
            '# ' + process.env.TICKET_ID,
            '',
            'BASE_SHA: ' + baseSha,
            'BASE_COMMIT: ' + process.env.BASE_COMMIT,
            'DRAFTED: ' + new Date().toISOString(),
            'BLOCKS: ' + blocks.length,
            '',
            '<!-- Claude: after review append a line "APPROVED_BY: claude".',
            '     The deployer refuses to run without it. -->',
            '',
            '---',
            ''
          ].join('\n');

          let foot = '\n\n---\n## DEPLOYER DATA\n\n';
          if (blocks.length === 0) {
            foot += 'ERROR: no SEARCH/REPLACE blocks detected. Nothing to deploy.\n';
          } else {
            foot += 'Verify each anchor is unique before approving.\n\n';
            blocks.forEach((b, i) => {
              foot += '### Block ' + (i + 1) + ' of ' + blocks.length + '\n\n';
              foot += 'SEARCH_BASE64:\n```text\n' + Buffer.from(b[1], 'utf8').toString('base64') + '\n```\n\n';
              foot += 'REPLACE_BASE64:\n```text\n' + Buffer.from(b[2], 'utf8').toString('base64') + '\n```\n\n';
            });
          }

          fs.mkdirSync('specs/gemini-proposals', { recursive: true });
          fs.writeFileSync(path.join('specs/gemini-proposals', process.env.TICKET_ID + '.md'), head + out + foot);
          console.log('Wrote spec: ' + blocks.length + ' block(s), BASE_SHA ' + baseSha.slice(0, 12));
          NODEEOF

      - name: Commit and Push Proposal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/
          git diff --cached --quiet && { echo "No spec change."; exit 0; }
          git commit -m "Draft Gemini Spec: ${{ inputs.ticket_id }}"
          git push
