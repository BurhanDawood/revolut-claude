name: Gemini Spec Writer

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: 'Ticket ID (e.g., Dev-263)'
        required: true
        type: string
      instructions:
        description: 'Instructions (e.g., Draft patch for auto-sell slippage)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Google Gen AI SDK
        run: npm install @google/genai

      - name: Generate Spec via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TICKET_ID: ${{ inputs.ticket_id }}
          INSTRUCTIONS: ${{ inputs.instructions }}
        run: |
          node --input-type=module << 'EOF'
          import { GoogleGenAI } from '@google/genai';
          import fs from 'fs';
          import path from 'path';

          const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
          
          const serverCode = fs.existsSync('server.js') ? fs.readFileSync('server.js', 'utf8') : 'Missing server.js';
          
          const prompt = `
          You are the lead architect for this system. 
          Ticket: ${process.env.TICKET_ID}
          Instructions: ${process.env.INSTRUCTIONS}
          
          Based on the instructions, draft the required SEARCH and REPLACE blocks to fix the issue in server.js.
          
          CRITICAL: Do not use Base64 encoding. You must format your response to include exact plain-text blocks formatted exactly like this:
          
          <<<<<<< SEARCH
          [exact lines to replace from server.js]
          =======
          [new replacement lines]
          >>>>>>> REPLACE
          
          Format the remainder of your response cleanly in Markdown explaining the change so Claude can read and review it easily.
          
          Codebase (server.js):
          ${serverCode}
          `;

          const response = await ai.models.generateContent({
            model: 'gemini-3.6-flash',
            contents: prompt
          });

          let outputText = response.text;
          
          // Automatically extract plain text blocks and compute bulletproof Base64 for the deployer
          const blockRegex = /<<<<<<< SEARCH\n([\s\S]*?)\n=======\n([\s\S]*?)\n>>>>>>> REPLACE/;
          const match = outputText.match(blockRegex);
          
          if (match) {
              const searchBase64 = Buffer.from(match[1]).toString('base64');
              const replaceBase64 = Buffer.from(match[2]).toString('base64');
              
              outputText += '\n\n---\n### 🤖 Automated Deployer Data\n';
              outputText += 'SEARCH_BASE64:\n```text\n' + searchBase64 + '\n```\n\n';
              outputText += 'REPLACE_BASE64:\n```text\n' + replaceBase64 + '\n```\n';
          } else {
              outputText += '\n\n---\n❌ ERROR: Node script could not detect <<<<<<< SEARCH / ======= / >>>>>>> REPLACE blocks to generate Base64.';
          }

          const dir = 'specs/gemini-proposals';
          if (!fs.existsSync(dir)){
              fs.mkdirSync(dir, { recursive: true });
          }

          const filePath = path.join(dir, `${process.env.TICKET_ID}.md`);
          fs.writeFileSync(filePath, outputText);
          console.log(`✅ Successfully wrote proposal and computed Base64 to ${filePath}`);
          EOF

      - name: Commit and Push Proposal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/
          git commit -m "Draft Gemini Spec: ${{ inputs.ticket_id }}"
          git push
