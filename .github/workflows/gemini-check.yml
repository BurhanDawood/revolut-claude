name: Gemini
on: [workflow_dispatch]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install @google/genai
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node --input-type=module -e "import {GoogleGenAI} from '@google/genai'; import fs from 'fs'; const ai = new GoogleGenAI({apiKey: process.env.GEMINI_API_KEY}); const code = fs.existsSync('server.js') ? fs.readFileSync('server.js', 'utf8').slice(0, 15000) : 'none'; ai.models.generateContent({model: 'gemini-2.5-flash', contents: 'Audit server.js:\n' + code}).then(r => console.log('\n--- GEMINI REPORT ---\n' + r.text));"
