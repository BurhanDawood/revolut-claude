name: Apply Surgical Patch

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit Message'
        required: true
        type: string
      search_base64:
        description: 'SEARCH block (Base64 encoded)'
        required: true
        type: string
      replace_base64:
        description: 'REPLACE block (Base64 encoded)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Apply Patch to server.js
        env:
          SEARCH_B64: ${{ inputs.search_base64 }}
          REPLACE_B64: ${{ inputs.replace_base64 }}
        run: |
          node -e "
            const fs = require('fs');
            const code = fs.readFileSync('server.js', 'utf8');
            
            // Decode Base64 inputs
            const searchStr = Buffer.from(process.env.SEARCH_B64, 'base64').toString('utf8');
            const replaceStr = Buffer.from(process.env.REPLACE_B64, 'base64').toString('utf8');
            
            // Normalize line endings to prevent Windows/Linux mismatch errors
            const safeCode = code.replace(/\r\n/g, '\n');
            const safeSearch = searchStr.replace(/\r\n/g, '\n');
            const safeReplace = replaceStr.replace(/\r\n/g, '\n');
            
            const occurrences = safeCode.split(safeSearch).length - 1;
            
            if (occurrences === 0) {
              console.error('\n❌ ERROR: Target search block not found. Check exact spacing.');
              process.exit(1);
            }
            if (occurrences > 1) {
              console.error('\n❌ ERROR: Search block is not unique (' + occurrences + ' matches).');
              process.exit(1);
            }
            
            fs.writeFileSync('server.js', safeCode.replace(safeSearch, safeReplace));
            console.log('\n✅ Patch applied successfully to server.js in memory.');
          "

      - name: Run Syntax Verification
        run: node --check server.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "${{ inputs.commit_message }}"
          git push
