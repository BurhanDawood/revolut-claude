name: Apply Batch Patch

# ONE paste per change set. The batch blob carries the commit message, every edit, and two
# fingerprints per file: the exact version it was built for (base) and the exact result that was
# reviewed and tested (after). Anything else stops the run with nothing written.
# v2: also accepts COMPRESSED batches (gzip), typically 8x shorter. Older batches still work.
# v3: a batch may edit SEVERAL files (server.js and the dashboard files in public/) in one run.
#     Every file must pass every check before ANY file is written - all or nothing.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch (one Base64 blob from Claude)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  batch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Apply Batch
        env:
          BATCH_B64: ${{ inputs.batch }}
        run: |
          node --input-type=module << 'NODEEOF'
          import fs from 'fs';
          import crypto from 'crypto';
          import zlib from 'zlib';
          const sha = (s) => crypto.createHash('sha256').update(s).digest('hex');
          const fail = (m) => { console.error('ABORT: ' + m); console.error('Nothing was written.'); process.exit(1); };

          let batch;
          try {
            const raw = (process.env.BATCH_B64 || '').replace(/\s+/g, '');
            let buf = Buffer.from(raw, 'base64');
            // v2: a compressed batch starts with the gzip signature 1f 8b.
            if (buf.length > 2 && buf[0] === 0x1f && buf[1] === 0x8b) buf = zlib.gunzipSync(buf);
            batch = JSON.parse(buf.toString('utf8'));
          } catch (e) {
            fail('the batch could not be read - most likely a truncated paste. ' + e.message);
          }
          if (!batch || !batch.m) fail('the batch is missing its message.');

          // v1/v2 batches describe server.js only; v3 batches list their files.
          const parts = Array.isArray(batch.files)
            ? batch.files
            : [{ f: 'server.js', base: batch.base, after: batch.after, edits: batch.edits }];
          if (parts.length === 0) fail('the batch lists no files.');

          // v3: only these files may ever be changed by a batch.
          const ALLOWED = /^(server\.js|public\/[A-Za-z0-9_-]+\.(js|html|css))$/;
          const seen = new Set();
          const results = [];
          for (const p of parts) {
            const f = String(p.f || '');
            if (!ALLOWED.test(f)) fail('file not allowed in a batch: ' + JSON.stringify(f));
            if (seen.has(f)) fail('file listed twice: ' + f);
            seen.add(f);
            if (!Array.isArray(p.edits) || p.edits.length === 0) fail(f + ': no edits.');
            if (!p.base || !p.after) fail(f + ': missing its base or after fingerprint.');
            if (!fs.existsSync(f)) fail(f + ': file not found.');

            const original = fs.readFileSync(f, 'utf8').replace(/\r\n/g, '\n');
            const baseSha = sha(original);
            // BASE CHECK. The file must be EXACTLY the version these edits were built for.
            // Running the same batch twice, or batches out of order, therefore stops here.
            if (!baseSha.startsWith(p.base)) {
              fail(f + ' is at ' + baseSha.slice(0, 16) + ' but this batch was built for ' + p.base + ' - already applied, or out of order.');
            }
            let code = original;
            p.edits.forEach((e, i) => {
              // v2+ batches carry the text directly (enc: 'raw'); v1 batches carry each block in Base64.
              const dec = (x) => batch.enc === 'raw' ? String(x) : Buffer.from(x, 'base64').toString('utf8');
              const s = dec(e.s).replace(/\r\n/g, '\n');
              const r = dec(e.r).replace(/\r\n/g, '\n');
              const n = code.split(s).length - 1;
              if (n !== 1) fail(f + ': edit ' + (i + 1) + ' of ' + p.edits.length + ' matched ' + n + ' times - it must match exactly once.');
              const before = code.length;
              // Replacer FUNCTION, never a string: $' $& $` $$ are special in a replacement
              // string and once spliced the rest of the file into server.js. See #328.
              code = code.replace(s, () => r);
              if (code.length - before !== r.length - s.length) fail(f + ': edit ' + (i + 1) + ' changed size unexpectedly - something expanded.');
            });
            // AFTER CHECK. The result must be byte-for-byte what Claude reviewed and tested.
            const afterSha = sha(code);
            if (!afterSha.startsWith(p.after)) {
              fail(f + ': the result would be ' + afterSha.slice(0, 16) + ' but the reviewed result is ' + p.after + '.');
            }
            results.push({ f, code, n: p.edits.length, from: baseSha.slice(0, 16), to: afterSha.slice(0, 16) });
          }

          // Every file passed every check: only now is anything written.
          for (const r of results) fs.writeFileSync(r.f, r.code);
          fs.writeFileSync('/tmp/changed_files.txt', results.map(r => r.f).join('\n') + '\n');
          const summary = results.map(r => r.f + ': ' + r.n + ' edits, ' + r.from + ' -> ' + r.to).join('; ');
          fs.writeFileSync('/tmp/commit_msg.txt', String(batch.m).slice(0, 300) + '\n\n[batch: ' + summary + ']\n');
          for (const r of results) console.log('Applied ' + r.n + ' edits to ' + r.f + ': ' + r.from + ' -> ' + r.to);
          NODEEOF

      - name: Run Syntax Verification
        run: |
          while read -r f; do
            case "$f" in
              *.js) echo "node --check $f"; node --check "$f" ;;
            esac
          done < /tmp/changed_files.txt

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r f; do git add -- "$f"; done < /tmp/changed_files.txt
          git diff --cached --quiet && { echo "No change to commit."; exit 1; }
          git commit -F /tmp/commit_msg.txt
          git push
