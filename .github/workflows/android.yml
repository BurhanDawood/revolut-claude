name: Android APK

# Builds the Revolut X Android app (mobile/) and publishes it as a prerelease (revolutx-PHONE.apk), together with (desk #59)
# the Galaxy Watch app (revolutx-WATCH-adb-only.apk, same applicationId and key) and its Watch Face Format face
# (revolutx-WATCHFACE-adb-only.apk). Only a run on mobile-app publishes a Release; a run on any other branch builds and checks.
# It never touches main, the server or Railway: it only reads mobile/ and writes a GitHub Release.
#
# Secrets (Settings -> Secrets and variables -> Actions), all optional for the build to pass:
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#       the release key. Every APK signed with it installs over the previous one. Without all four the
#       APK is signed with a throwaway key made for that run: it installs, but not over another build.
#       android-signing-setup.yml creates the release key and these four secrets once.
#   GOOGLE_SERVICES_JSON_B64 or GOOGLE_SERVICES_JSON
#       Firebase's google-services.json, base64 or pasted as plain JSON (the _B64 one wins when both exist).
#       Without either the app builds with push off.

on:
  push:
    branches: [ mobile-app ]
  workflow_dispatch:

permissions:
  contents: write   # to publish the Release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the action's default ('tools') is no longer in the SDK repository
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install and sync
        working-directory: mobile
        run: npm ci && npx cap sync android

      - name: google-services.json (optional)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          OUT=mobile/android/app/google-services.json
          if [ -n "$GS_B64" ]; then
            printf '%s' "$GS_B64" | base64 -d > "$OUT"
            echo "Push: on (google-services.json from GOOGLE_SERVICES_JSON_B64)"
          elif [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > "$OUT"
            echo "Push: on (google-services.json from GOOGLE_SERVICES_JSON)"
          else
            echo "Push: off (no GOOGLE_SERVICES_JSON_B64 or GOOGLE_SERVICES_JSON secret)"
          fi
          if [ -f "$OUT" ] && ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$OUT" 2>/dev/null; then
            echo "::error::the Firebase secret is not valid JSON (check you pasted the whole google-services.json)"
            exit 1
          fi

      - name: Keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/revolutx.keystore"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            echo "SIGNING=release" >> "$GITHUB_ENV"
            echo "Signing: release key from repository secrets"
          else
            # no release key yet: a throwaway key for this run only (never stored, never printed)
            TMP_PASS="$(openssl rand -hex 24)"
            echo "::add-mask::$TMP_PASS"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias revolutx -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$TMP_PASS" -keypass "$TMP_PASS" -dname "CN=Revolut X test build" > /dev/null 2>&1
            {
              echo "SIGNING=temporary"
              echo "TMP_KS_PASS=$TMP_PASS"
            } >> "$GITHUB_ENV"
            echo "::warning title=Temporary signing::The ANDROID_* signing secrets are not set. This APK is signed with a one-off key: it installs, but will not install over another build. See mobile/README.md."
          fi
          echo "ANDROID_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Key-free check (desk #59 W4)
        # no APK may carry a key or token (W4/W8): the phone gets the dashboard key from the shell; the watch gets only the
        # watch-only token, from the phone at run time
        run: |
          if grep -rInE 'DASHBOARD_TOKEN|FAMILY_PAGE_TOKEN|WATCH_TOKEN|x-api-token"?[[:space:]]*[:=][[:space:]]*"[^"]' mobile \
               --exclude-dir=node_modules --exclude-dir=build --exclude-dir=.gradle; then
            echo "::error::a key or token name/value is in mobile/ - the APKs must stay key-free"
            exit 1
          fi
          # any bare token-shaped literal (32+ letters, digits, _ or -) in the Java sources
          if grep -rnE '"[A-Za-z0-9_-]{32,}"' mobile/android/app/src mobile/android/wear/src --include=*.java; then
            echo "::error::a token-shaped string literal is in the app or watch sources - the APKs must stay key-free"
            exit 1
          fi
          echo "Key-free: no dashboard key or token in mobile/"

      - name: Build release APK
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || env.TMP_KS_PASS }}
          ANDROID_KEY_ALIAS: ${{ env.SIGNING == 'release' && secrets.ANDROID_KEY_ALIAS || 'revolutx' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || env.TMP_KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :wear:assembleRelease :watchface:assembleRelease --no-daemon --stacktrace
          for pair in app/build/outputs/apk/release/app-release.apk:revolutx-PHONE.apk \
                      wear/build/outputs/apk/release/wear-release.apk:revolutx-WATCH-adb-only.apk \
                      watchface/build/outputs/apk/release/watchface-release.apk:revolutx-WATCHFACE-adb-only.apk; do
            APK="${pair%%:*}"; OUT="${pair##*:}"
            test -f "$APK" || { echo "::error::no signed $APK was produced"; ls -R */build/outputs/apk; exit 1; }
            echo "$OUT: $("$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | grep -i "certificate SHA-256" | head -1)"
            cp "$APK" "$GITHUB_WORKSPACE/$OUT"
          done
          cp wear/build/outputs/mapping/release/mapping.txt "$GITHUB_WORKSPACE/watch-mapping.txt"

      - name: Watch APK smoke check (R8 kept what the system binds by name)
        working-directory: mobile/android
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK="$GITHUB_WORKSPACE/revolutx-WATCH-adb-only.apk"
          MAP=wear/build/outputs/mapping/release/mapping.txt
          MANIFEST="$("$BT"/aapt2 dump xmltree --file AndroidManifest.xml "$APK")"
          DEX="$(unzip -p "$APK" 'classes*.dex' | strings -n 8)"
          fail=0
          for C in MainActivity OpenOnPhoneActivity KeyListener RxTileService TotalComplication PnlComplication NotesComplication MoverComplication; do
            N="com.bryan.revolutx.wear.$C"
            m=no; k=no; d=no
            printf '%s\n' "$MANIFEST" | grep -qF "=\"$N\"" && m=yes
            grep -qxF "$N -> $N:" "$MAP" && k=yes
            printf '%s\n' "$DEX" | grep -qF "L${N//.//};" && d=yes
            echo "$C: manifest=$m kept-by-name=$k in-dex=$d"
            [ "$m$k$d" = yesyesyes ] || { echo "::error::$N is missing from the watch APK (manifest=$m mapping=$k dex=$d)"; fail=1; }
          done
          for N in androidx.security.crypto.EncryptedSharedPreferences androidx.security.crypto.MasterKeys; do
            if grep -qxF "$N -> $N:" "$MAP"; then echo "$N: kept-by-name=yes"; else echo "::error::$N was renamed or removed by R8"; fail=1; fi
          done
          {
            echo "### APK sizes"
            echo "| file | bytes | MB |"; echo "|---|---|---|"
            for f in revolutx-PHONE.apk revolutx-WATCH-adb-only.apk revolutx-WATCHFACE-adb-only.apk; do
              b=$(stat -c %s "$GITHUB_WORKSPACE/$f"); echo "| $f | $b | $(awk "BEGIN{printf \"%.2f\", $b/1048576}") |"
            done
            echo; echo "Watch dex files: $(unzip -l "$APK" | grep -c 'classes[0-9]*\.dex')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: |
            revolutx-PHONE.apk
            revolutx-WATCH-adb-only.apk
            revolutx-WATCHFACE-adb-only.apk
            watch-mapping.txt
          if-no-files-found: error

      - name: Publish Release
        if: github.ref == 'refs/heads/mobile-app'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Revolut X app v${{ github.run_number }}${{ env.SIGNING == 'temporary' && ' (test signing)' || '' }}
          prerelease: true
          files: |
            revolutx-PHONE.apk
            revolutx-WATCH-adb-only.apk
            revolutx-WATCHFACE-adb-only.apk
          body: |
            Android app build ${{ github.run_number }} from `${{ github.ref_name }}` (${{ github.sha }}).
            Versioncode ${{ github.run_number }}.
            **Phone: open `revolutx-PHONE.apk` on the phone. Watch: `revolutx-WATCH-adb-only.apk` and `revolutx-WATCHFACE-adb-only.apk` go on the Galaxy Watch with adb only - never open them on the phone.** (mobile/README.md "The watch")
            ${{ env.SIGNING == 'temporary' && 'Signed with a one-off test key because the release signing secrets are not set: it will NOT install over another build (uninstall the old one first).' || 'Signed with the release key: installs over the previous build.' }}
