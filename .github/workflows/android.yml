name: Android APK

# Builds the Revolut X Android app (mobile/) and publishes it as a prerelease (revolutx-PHONE.apk), together with (desk #59)
# the Galaxy Watch app (revolutx-WATCH-adb-only.apk, same applicationId and key) and its Watch Face Format face
# (revolutx-WATCHFACE-adb-only.apk). Only a run on mobile-app publishes a Release; a run on any other branch builds and checks.
# A manual run (Run workflow) also runs wear-emulator: the watch app and the face on a Wear OS emulator, with screenshots.
# It never touches main, the server or Railway: it only reads mobile/ and writes a GitHub Release.
#
# Secrets (Settings -> Secrets and variables -> Actions), all optional for the build to pass:
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#       the release key. Every APK signed with it installs over the previous one. Without all four the
#       APK is signed with a throwaway key made for that run: it installs, but not over another build.
#       android-signing-setup.yml creates the release key and these four secrets once.
#   GOOGLE_SERVICES_JSON_B64 or GOOGLE_SERVICES_JSON
#       Firebase's google-services.json, base64 or pasted as plain JSON (the _B64 one wins when both exist).
#       Without either the app builds with push off.

on:
  push:
    branches: [ mobile-app ]
  workflow_dispatch:

permissions:
  contents: write   # to publish the Release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the action's default ('tools') is no longer in the SDK repository
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install and sync
        working-directory: mobile
        run: npm ci && npx cap sync android

      - name: google-services.json (optional)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          OUT=mobile/android/app/google-services.json
          if [ -n "$GS_B64" ]; then
            printf '%s' "$GS_B64" | base64 -d > "$OUT"
            echo "Push: on (google-services.json from GOOGLE_SERVICES_JSON_B64)"
          elif [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > "$OUT"
            echo "Push: on (google-services.json from GOOGLE_SERVICES_JSON)"
          else
            echo "Push: off (no GOOGLE_SERVICES_JSON_B64 or GOOGLE_SERVICES_JSON secret)"
          fi
          if [ -f "$OUT" ] && ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$OUT" 2>/dev/null; then
            echo "::error::the Firebase secret is not valid JSON (check you pasted the whole google-services.json)"
            exit 1
          fi

      - name: Keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/revolutx.keystore"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            echo "SIGNING=release" >> "$GITHUB_ENV"
            echo "Signing: release key from repository secrets"
          else
            # no release key yet: a throwaway key for this run only (never stored, never printed)
            TMP_PASS="$(openssl rand -hex 24)"
            echo "::add-mask::$TMP_PASS"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias revolutx -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$TMP_PASS" -keypass "$TMP_PASS" -dname "CN=Revolut X test build" > /dev/null 2>&1
            {
              echo "SIGNING=temporary"
              echo "TMP_KS_PASS=$TMP_PASS"
            } >> "$GITHUB_ENV"
            echo "::warning title=Temporary signing::The ANDROID_* signing secrets are not set. This APK is signed with a one-off key: it installs, but will not install over another build. See mobile/README.md."
          fi
          echo "ANDROID_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Key-free check (desk #59 W4)
        # no APK may carry a key or token (W4/W8): the phone gets the dashboard key from the shell; the watch gets only the
        # watch-only token, from the phone at run time
        run: |
          if grep -rInE 'DASHBOARD_TOKEN|FAMILY_PAGE_TOKEN|WATCH_TOKEN|x-api-token"?[[:space:]]*[:=][[:space:]]*"[^"]' mobile \
               --exclude-dir=node_modules --exclude-dir=build --exclude-dir=.gradle; then
            echo "::error::a key or token name/value is in mobile/ - the APKs must stay key-free"
            exit 1
          fi
          # any bare token-shaped literal (32+ letters, digits, _ or -) in the Java sources
          if grep -rnE '"[A-Za-z0-9_-]{32,}"' mobile/android/app/src mobile/android/wear/src --include=*.java; then
            echo "::error::a token-shaped string literal is in the app or watch sources - the APKs must stay key-free"
            exit 1
          fi
          echo "Key-free: no dashboard key or token in mobile/"

      - name: Build release APK
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || env.TMP_KS_PASS }}
          ANDROID_KEY_ALIAS: ${{ env.SIGNING == 'release' && secrets.ANDROID_KEY_ALIAS || 'revolutx' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || env.TMP_KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :wear:assembleRelease :watchface:assembleRelease --no-daemon --stacktrace
          for pair in app/build/outputs/apk/release/app-release.apk:revolutx-PHONE.apk \
                      wear/build/outputs/apk/release/wear-release.apk:revolutx-WATCH-adb-only.apk \
                      watchface/build/outputs/apk/release/watchface-release.apk:revolutx-WATCHFACE-adb-only.apk; do
            APK="${pair%%:*}"; OUT="${pair##*:}"
            test -f "$APK" || { echo "::error::no signed $APK was produced"; ls -R */build/outputs/apk; exit 1; }
            echo "$OUT: $("$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | grep -i "certificate SHA-256" | head -1)"
            cp "$APK" "$GITHUB_WORKSPACE/$OUT"
          done
          cp wear/build/outputs/mapping/release/mapping.txt "$GITHUB_WORKSPACE/watch-mapping.txt"

      - name: Phone unit test (desk #59, what the phone forwards to the watch)
        working-directory: mobile/android
        run: |
          ./gradlew :app:testDebugUnitTest --tests 'com.bryan.revolutx.WatchAlarmTest' --no-daemon -q
          R=app/build/test-results/testDebugUnitTest/TEST-com.bryan.revolutx.WatchAlarmTest.xml
          grep -oE 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+" errors="[0-9]+"' "$R"
          grep -E 'push -> watch' "$R" || true

      - name: Watch APK smoke check (R8 kept what the system binds by name)
        working-directory: mobile/android
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK="$GITHUB_WORKSPACE/revolutx-WATCH-adb-only.apk"
          MAP=wear/build/outputs/mapping/release/mapping.txt
          MANIFEST="$("$BT"/aapt2 dump xmltree --file AndroidManifest.xml "$APK")"
          DEX="$(unzip -p "$APK" 'classes*.dex' | strings -n 8)"
          fail=0
          for C in MainActivity OpenOnPhoneActivity KeyListener RxTileService TotalComplication PnlComplication NotesComplication MoverComplication \
                   CardComplication DotComplication FaceTotalComplication AmbientCardComplication CoinTile1 CoinTile2 CoinTile3 MoversTileService \
                   NotesTileService CoinActivity TileCoinsActivity NotesActivity RipRing RipAlarmActivity RipComplication; do
            N="com.bryan.revolutx.wear.$C"
            m=no; k=no; d=no
            printf '%s\n' "$MANIFEST" | grep -qF "=\"$N\"" && m=yes
            grep -qxF "$N -> $N:" "$MAP" && k=yes
            printf '%s\n' "$DEX" | grep -qF "L${N//.//};" && d=yes
            echo "$C: manifest=$m kept-by-name=$k in-dex=$d"
            [ "$m$k$d" = yesyesyes ] || { echo "::error::$N is missing from the watch APK (manifest=$m mapping=$k dex=$d)"; fail=1; }
          done
          # desk #59 (15 Oct): the Data Layer listener is in the manifest with its filters, so messages arrive with the app closed
          printf '%s\n' "$MANIFEST" | grep -A12 'com.bryan.revolutx.wear.KeyListener' | grep -E 'MESSAGE_RECEIVED|CHANNEL_EVENT|pathPrefix' | sed 's/^ */KeyListener: /'
          for N in androidx.security.crypto.EncryptedSharedPreferences androidx.security.crypto.MasterKeys; do
            if grep -qxF "$N -> $N:" "$MAP"; then echo "$N: kept-by-name=yes"; else echo "::error::$N was renamed or removed by R8"; fail=1; fi
          done
          {
            echo "### APK sizes"
            echo "| file | bytes | MB |"; echo "|---|---|---|"
            for f in revolutx-PHONE.apk revolutx-WATCH-adb-only.apk revolutx-WATCHFACE-adb-only.apk; do
              b=$(stat -c %s "$GITHUB_WORKSPACE/$f"); echo "| $f | $b | $(awk "BEGIN{printf \"%.2f\", $b/1048576}") |"
            done
            echo; echo "Watch dex files: $(unzip -l "$APK" | grep -c 'classes[0-9]*\.dex')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: Watch face check (Google's WFF validator, no code in the package)
        # desk #59 (13 Oct 23:20): app-v17's face would not apply. A WFF face must be valid XML for its format and carry no code.
        run: |
          set -e
          FACE="$GITHUB_WORKSPACE/revolutx-WATCHFACE-adb-only.apk"
          if unzip -l "$FACE" | grep -q 'classes[0-9]*\.dex'; then echo "::error::the face APK contains a classes.dex (a WFF face must have no code)"; exit 1; fi
          echo "Face APK: no dex"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT"/aapt2 dump xmltree --file AndroidManifest.xml "$FACE" | grep -E 'hasCode|watchface.format|E: (application|property)' | sed 's/^ *//'
          # Google's validator (google/watchface, third_party/wff), built from a pinned commit with its four Maven Central jars
          V="$RUNNER_TEMP/wffv"; mkdir -p "$V/lib" "$V/out"
          git clone -q https://github.com/google/watchface "$V/src"
          git -C "$V/src" checkout -q b6cdda0acd3e4c5d0be5624fcdc01209380029d1
          M=https://repo1.maven.org/maven2
          curl -sSfLo "$V/lib/xml-apis.jar" $M/xml-apis/xml-apis/1.4.01/xml-apis-1.4.01.jar
          curl -sSfLo "$V/lib/xerces.jar" $M/org/exist-db/thirdparty/xerces/xercesImpl/2.12.0/xercesImpl-2.12.0-xml-schema-1.1.jar
          curl -sSfLo "$V/lib/xpath2.jar" $M/com/rackspace/eclipse/webtools/sourceediting/org.eclipse.wst.xml.xpath2.processor/2.1.100/org.eclipse.wst.xml.xpath2.processor-2.1.100.jar
          curl -sSfLo "$V/lib/cup.jar" $M/edu/princeton/cup/java-cup/10k/java-cup-10k.jar
          curl -sSfLo "$V/lib/icu.jar" $M/com/ibm/icu/icu4j/4.6/icu4j-4.6.jar
          echo "a840968176645684bb01aed376e067ab39614885f9eee44abe35a5f20ebe7fad  $V/lib/xml-apis.jar
          ddbe5a00ab903c93e5a7f2b750fe48bb1147c538ba2a7afeec3a4b535ee12dc4  $V/lib/xerces.jar
          a7a73a0a668d0a9b9effb046d20076e33f18ae4c02d418b56721ef57b216ed79  $V/lib/xpath2.jar
          15894fad0a81611e351b5200bbc3bd21359fc6aed53af54a48998390e4b2700d  $V/lib/cup.jar
          b7efe223de080eb29fd9f341777cd85bfa4c770469a7fea9b0c2d27108893673  $V/lib/icu.jar" | sed 's/^ *//' | sha256sum -c --quiet
          W="$V/src/third_party/wff/specification"
          (cd "$W/documents" && zip -qr "$V/out/docs.zip" .)
          javac -nowarn -cp "$V/lib/*" -d "$V/out" $(find "$W/validator/src/main/java" -name '*.java')
          FMT=$(grep -A1 'watchface.format.version' mobile/android/watchface/src/main/AndroidManifest.xml | grep -oE 'android:value="[0-9]+"' | grep -oE '[0-9]+')
          R=$(java -cp "$V/out:$V/lib/*" com.samsung.watchface.DWFValidationApplication "$FMT" mobile/android/watchface/src/main/res/raw/watchface.xml 2>&1)
          echo "$R" | grep -E 'PASSED|FAILED|SEVERE'
          echo "$R" | grep -q 'PASSED' || { echo "::error::watchface.xml is not valid Watch Face Format v$FMT"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: |
            revolutx-PHONE.apk
            revolutx-WATCH-adb-only.apk
            revolutx-WATCHFACE-adb-only.apk
            watch-mapping.txt
          if-no-files-found: error

      - name: Publish Release
        if: github.ref == 'refs/heads/mobile-app'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Revolut X app v${{ github.run_number }}${{ env.SIGNING == 'temporary' && ' (test signing)' || '' }}
          prerelease: true
          files: |
            revolutx-PHONE.apk
            revolutx-WATCH-adb-only.apk
            revolutx-WATCHFACE-adb-only.apk
          body: |
            Android app build ${{ github.run_number }} from `${{ github.ref_name }}` (${{ github.sha }}).
            Versioncode ${{ github.run_number }}.
            **Phone: open `revolutx-PHONE.apk` on the phone. Watch: `revolutx-WATCH-adb-only.apk` and `revolutx-WATCHFACE-adb-only.apk` go on the Galaxy Watch with adb only - never open them on the phone.** (mobile/README.md "The watch")
            ${{ env.SIGNING == 'temporary' && 'Signed with a one-off test key because the release signing secrets are not set: it will NOT install over another build (uninstall the old one first).' || 'Signed with the release key: installs over the previous build.' }}

  wear-emulator:
    # Desk #59 (13 Oct 23:20): the watch app and the face on a Wear OS emulator. It installs them, applies app-v17's face and
    # this build's with Wear OS's developer broadcast, and prints logcat plus small screenshots (base64 "IMG" lines) in the
    # log. Manual runs only (Run workflow): it takes about 15 minutes. Nothing secret: the emulator never gets a key.
    if: github.event_name == 'workflow_dispatch'
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34          # Wear OS 5
            target: android-wear
          - api: 36          # Wear OS 6, the Galaxy Watch 8's
            target: android-wear-signed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Debug watch app and its CI test
        run: |
          (cd mobile && npm ci && npx cap sync android)
          cd mobile/android && chmod +x gradlew && ./gradlew :wear:assembleDebug :wear:assembleDebugAndroidTest --no-daemon

      - name: This run's release APKs
        uses: actions/download-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: rel

      - name: app-v17's face (the one that would not apply)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download app-v17 -R "$GITHUB_REPOSITORY" -p revolutx-WATCHFACE-adb-only.apk -O rel/face-v17.apk || echo "app-v17's face is not available"

      - name: KVM and ImageMagick
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Wear OS emulator (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: wearos_large_round
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash mobile/android/ci/wear-emulator-check.sh rel
